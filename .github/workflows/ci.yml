name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README claims and the oldest the annotations in
        # egress-broker.py are written for; 3.13 is current stable. The matrix
        # exists because the fallback TOML parser is only exercised below 3.11.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # Keep the cross-product to something people will wait for.
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.11" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.11" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Every step below declares `shell: bash`. The default shell on
      # windows-latest is PowerShell, where `tee`, `grep`, `[` and `$n` do not
      # exist -- so an undeclared POSIX step does not fail loudly on Windows, it
      # fails in a way that looks like the tool is broken. Git Bash is present
      # on the Windows runners and setup-python's PATH reaches it.

      - name: Confirm the tool has no third-party imports
        # The single-file distribution is the feature. A stray `import requests`
        # would break every install that only has a Python, so it is checked
        # rather than assumed.
        shell: bash
        run: python ci/import_gate.py

      - name: Selftest
        # Two assertions, because the check count is not the same on every
        # interpreter. Two checks need tomllib (stdlib from 3.11) and are
        # reported as skipped on 3.9 rather than silently absent -- a suite that
        # quietly dropped them would otherwise look identical to one that
        # correctly skipped them. So: many checks must actually RUN, and the
        # run-plus-skipped total must not have shrunk.
        shell: bash
        run: |
          set -euo pipefail
          python egress-broker.py --selftest | tee selftest.log
          ran=$(grep -c "^  ok   " selftest.log || true)
          skipped=$(grep -c "^  skip " selftest.log || true)
          total=$((ran + skipped))
          echo "checks: $ran run, $skipped skipped, $total total"
          # 208 is what runs on 3.9, where the two tomllib cross-checks skip.
          if [ "$ran" -lt 208 ]; then
            echo "::error::selftest ran only $ran checks, expected at least 208"
            exit 1
          fi
          if [ "$total" -lt 210 ]; then
            echo "::error::selftest covered $total checks, expected at least 210"
            exit 1
          fi

      - name: Selftest can actually fail
        # Breaks the tool on purpose and requires the suite to notice. Without
        # this, a selftest that had stopped asserting anything would sail past
        # the count check above and make the whole job theatre.
        shell: bash
        run: python ci/prove_suites_can_fail.py

      - name: End-to-end
        # The count comes from unittest's own `Ran N tests`, not from counting
        # `... ok` lines: with verbosity=2 a test carrying a docstring puts its
        # `... ok` on the docstring line, and any line-based count of it is
        # quietly wrong by however many tests have docstrings.
        shell: bash
        run: |
          set -uo pipefail
          python tests/test_egress_broker.py 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          n=$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' e2e.log | head -1)
          n=${n:-0}
          echo "tests: $n"
          if [ "$n" -lt 42 ]; then
            echo "::error::only $n tests ran, expected at least 42"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the end-to-end suite reported failures (exit $status)"
            exit "$status"
          fi

      - name: Audit chain verifies on a real store, and detects deletion
        # Serve real traffic, verify the chain, then remove a row from the middle
        # and require the verify to fail. It has to be a middle row: the oldest
        # row is the trust anchor, so deleting it cannot be detected and asserting
        # otherwise would be asserting something the design does not promise.
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/audit.db"
          python egress-broker.py serve --listen 127.0.0.1:18888 --db "$db" --dry-run &
          broker=$!
          trap 'kill "$broker" 2>/dev/null || true' EXIT

          up=0
          for _ in $(seq 1 50); do
            if python -c "import socket; socket.create_connection(('127.0.0.1', 18888), 0.5).close()" 2>/dev/null; then
              up=1
              break
            fi
            sleep 0.2
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::the broker never started listening"
            exit 1
          fi

          for path in /v1/chat/completions /v1/chat/completions /v1/messages /nope; do
            printf 'POST http://api.openai.com%s HTTP/1.1\r\nHost: api.openai.com\r\nContent-Length: 2\r\nConnection: close\r\n\r\nhi' "$path" \
              | python -c "import socket,sys; s=socket.create_connection(('127.0.0.1',18888),10); s.sendall(sys.stdin.buffer.read()); s.recv(65536)"
          done
          kill "$broker" 2>/dev/null || true
          wait "$broker" 2>/dev/null || true

          python egress-broker.py verify --db "$db"
          echo "chain verified while intact"

          # The path goes in as argv, never spliced into the source: on the
          # Windows runners $RUNNER_TEMP is a backslash path, and a mangled
          # literal would open the wrong file or none at all.
          python - "$db" <<'PY'
          import sqlite3, sys

          conn = sqlite3.connect(sys.argv[1])
          rows = conn.execute("SELECT id FROM events ORDER BY id ASC").fetchall()
          if len(rows) < 3:
              raise SystemExit(f"only {len(rows)} event(s); cannot delete a mid-chain row")
          victim = rows[2][0]          # index 0 is the trust anchor, 2 is interior
          conn.execute("DELETE FROM events WHERE id = ?", (victim,))
          conn.commit()
          print("deleted interior row id =", victim)
          PY

          if python egress-broker.py verify --db "$db"; then
            echo "::error::verify passed after an interior row was deleted"
            exit 1
          fi
          echo "tampering detected, as it must be"

      - name: No orphaned broker processes
        # Ubuntu only, on purpose. Under Git Bash `ps` is the MSYS one, which
        # rejects `-eo args` outright and lists only MSYS processes, so on the
        # Windows runner this check reported "none" and exited 0 whether or not
        # a broker survived -- a green tick that proved nothing. The step below
        # now asserts ps works before trusting its answer, so it cannot fail
        # silently anywhere.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          if ! ps -eo args >/dev/null 2>&1; then
            echo "::error::ps -eo args is unsupported here, so this check cannot be trusted"
            exit 1
          fi
          sleep 1
          if ps -eo args | grep -F "egress-broker.py serve" | grep -v grep; then
            echo "::error::a broker process outlived its test"
            ps -eo pid,args | grep -F "egress-broker.py serve" | grep -v grep
            exit 1
          fi
          echo "none"